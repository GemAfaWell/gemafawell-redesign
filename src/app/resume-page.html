<main class="resume-container" aria-labelledby="resume-title">
  <h1 id="resume-title" class="resume-title">Gemini S. Powell's Resume</h1>
  <button
    type="button"
    class="reveal-btn"
    (click)="revealResume()"
    [attr.aria-expanded]="showResume()"
    [attr.aria-controls]="'resume-viewer'"
    *ngIf="!showResume()"
  >
    Show Resume
  </button>

  <section
    *ngIf="showResume()"
    id="resume-viewer"
    class="resume-viewer"
    aria-label="PDF Resume"
  >
    <iframe
      src="/resume.pdf"
      title="Gemini S. Powell Resume PDF"
      width="100%"
      height="900"
      style="border: none;"
    ></iframe>
    <a
      href="/resume.pdf"
      download
      class="download-btn"
      >Download PDF</a>
  </section>
</main>
